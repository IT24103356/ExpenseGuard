[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expenseguard-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "google-genai>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
