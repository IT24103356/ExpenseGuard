services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expenseguard
      POSTGRES_PASSWORD: replace-me
      POSTGRES_DB: ExpenseGuard_IT24103356
    ports:
      - "5432:5432"
    volumes:
      - expenseguard-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenseguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/ExpenseGuard.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Database=ExpenseGuard_IT24103356;Username=expenseguard;Password=replace-me
      Jwt__SigningKey: replace-with-at-least-32-random-bytes!!
      Cors__Origins__0: http://localhost:5173
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  agents:
    build:
      context: ./ai/expenseguard-agents
      dockerfile: Dockerfile
    environment:
      EXPENSEGUARD_FAKE_MODE: "true"
      EXPENSEGUARD_ASPNET_BASE_URL: http://api:8080
      EXPENSEGUARD_POSTGRES_DSN: postgresql://expenseguard:replace-me@postgres:5432/ExpenseGuard_IT24103356
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  expenseguard-pg:
